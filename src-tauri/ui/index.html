<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Punchboard</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0d0e11; color: #a3a9b4; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .box { display: grid; justify-items: center; gap: 16px; }
    svg { width: 44px; height: 44px; color: #f1f2f4; }
    .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
    @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  </style>
</head>
<body>
  <div class="box">
    <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g><rect x="14" y="3" width="7" height="7" rx="1.5" fill="#ff4f00"/></svg>
    <div class="dots">Starting Punchboard</div>
  </div>
</body>
</html>
