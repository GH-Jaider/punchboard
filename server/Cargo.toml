[package]
name = "punchboard-server"
version = "2.0.0"
description = "The Punchboard companion: serves the decks and runs their buttons on this computer."
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "punchboard_server"
path = "src/lib.rs"

[[bin]]
name = "punchboard-server"
path = "src/main.rs"

# Rule for every dependency: it must build for macOS, Windows and Linux, and
# must not compile C for macOS or Windows (no ring, no aws-lc, no openssl
# there), so `cargo check --target x86_64-pc-windows-msvc` works from a Mac.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "io-std", "fs", "process", "signal"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
getrandom = "0.2"
qrcode = { version = "0.14", default-features = false }
icu_plurals = "2"
icu_locale_core = "2"
fixed_decimal = "0.7"
unicode-normalization = "0.1"
socket2 = "0.6"
if-addrs = { version = "0.15", features = ["link-local"] }
gethostname = "1"
url = "2"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "mp3"] }
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
libm = "0.2"
icu_collator = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
core-graphics = { version = "0.25", features = ["highsierra"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation", "NSString", "NSURL", "NSError"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSGraphicsContext", "objc2-core-graphics", "NSWorkspace", "NSRunningApplication", "block2"] }
objc2 = "0.6"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }

[target.'cfg(target_os = "linux")'.dependencies]
pulseaudio = "0.3"
x11rb = { version = "0.13", features = ["xtest"] }
evdev = "0.13"
