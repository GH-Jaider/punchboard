# Builds the installers when a version tag is pushed (git tag v1.2.0 && git
# push --tags) and leaves them in a draft release. Nobody gets the update
# until the draft is published on GitHub, so a build can be tried first.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Seconds, before the builds spend ten minutes on a release that the
  # publish job would then refuse.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag and every version agree
        run: |
          PKG=$(node -p 'require("./package.json").version')
          CONF=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          CARGO=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "package.json $PKG, tauri.conf.json $CONF, Cargo.toml $CARGO, ref $GITHUB_REF_NAME"
          if [ "$PKG" != "$CONF" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::The versions differ: package.json $PKG, src-tauri/tauri.conf.json $CONF, src-tauri/Cargo.toml $CARGO"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $PKG"; exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The Control Center test drives the built pages, so build them first.
      - run: npm run build
      - run: npm test
      - run: node scripts/release-windows.mjs x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: punchboard-windows
          path: release/*/*
          if-no-files-found: error

  mac:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install rcodesign
        run: |
          V=0.29.0
          curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$V/apple-codesign-$V-macos-universal.tar.gz" | tar -xz -C "$RUNNER_TEMP" \
            && mkdir -p ~/.cargo/bin && cp "$RUNNER_TEMP/apple-codesign-$V-macos-universal/rcodesign" ~/.cargo/bin/ \
            || cargo install apple-codesign --version "$V" --locked
          ~/.cargo/bin/rcodesign --version
      - name: Restore the signing certificate
        run: node scripts/mac-signing.mjs setup
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      - run: npm ci
      - run: npm run build
      # The Mac-only paths (key presses, music, the trackpad) are tested here.
      - run: npm test
      - run: node scripts/release-mac.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: punchboard-mac
          path: release/*/*
          if-no-files-found: error

  publish:
    needs: [windows, mac]
    # A manual run only builds; a release needs a version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect the builds
        run: |
          VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match version $VERSION in tauri.conf.json"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p "release/$VERSION"
      - uses: actions/download-artifact@v4
        with:
          pattern: punchboard-*
          merge-multiple: true
          # Each build uploads release/<version>/…, and keeps the <version> folder.
          path: release
      - name: Write latest.json for the updater
        run: node scripts/latest-json.mjs "Punchboard ${VERSION}"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "release/$VERSION"
          FILES=(*.dmg *.exe *.app.tar.gz *.sig latest.json)
          # A tag pushed again (after fixing a failed build) finds its draft
          # already there: refresh its files. A published release is left alone.
          if DRAFT=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$DRAFT" != "true" ]; then echo "::error::$GITHUB_REF_NAME is already published; push a new version instead."; exit 1; fi
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "Punchboard $VERSION" --notes "Punchboard $VERSION" "${FILES[@]}"
          fi
